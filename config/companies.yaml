# Seed boards imported into the generated registry on first run.
#
# IMPORTANT: run `python -m jobradar.cli doctor` before trusting this file.
# Companies migrate between ATS vendors constantly, so treat every token
# below as a starting guess, not gospel. `doctor` tells you which are live
# and which need a five-second fix.
#
# Finding a token: open the company's careers page and look at the URL it
# redirects to.
#     boards.greenhouse.io/TOKEN        -> ats: greenhouse
#     jobs.lever.co/TOKEN               -> ats: lever
#     jobs.ashbyhq.com/TOKEN            -> ats: ashby
#     jobs.smartrecruiters.com/TOKEN    -> ats: smartrecruiters
#     apply.workable.com/TOKEN          -> ats: workable
#     TOKEN.recruitee.com               -> ats: recruitee
#
# Adding a company costs one line. Add every firm you'd actually work for —
# the marginal cost of polling one more board is about 200ms.

companies:
  # --- data & AI platforms -------------------------------------------
  - { name: Databricks,    ats: greenhouse, token: databricks }
  - { name: Anthropic,     ats: greenhouse, token: anthropic }
  - { name: Scale AI,      ats: greenhouse, token: scaleai }
  - { name: Weights&Biases, ats: greenhouse, token: weightsandbiases }
  - { name: Hugging Face,  ats: lever,      token: huggingface }
  - { name: LangChain,     ats: ashby,      token: langchain }

